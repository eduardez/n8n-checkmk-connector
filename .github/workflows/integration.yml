name: Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkmk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      # Point these repository secrets at a disposable Checkmk site. The suite
      # creates and deletes its own folder, host and activation changes.
      - run: npm run test:integration
        env:
          CHECKMK_BASE_URL: ${{ secrets.CHECKMK_BASE_URL }}
          CHECKMK_SITE: ${{ secrets.CHECKMK_SITE }}
          CHECKMK_USERNAME: ${{ secrets.CHECKMK_USERNAME }}
          CHECKMK_PASSWORD: ${{ secrets.CHECKMK_PASSWORD }}
