name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # isolated-vm has no prebuilt binary for every Node release; the node
      # only needs the n8n-workflow runtime, so skip dependency build scripts.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm pack --dry-run
