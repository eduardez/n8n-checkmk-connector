name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v0.2.0)
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      # prepublishOnly runs build + lint, so a broken artifact cannot ship.
      - name: Publish unless the version already exists
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "n8n-checkmk-connector@$VERSION" version >/dev/null 2>&1; then
            echo "n8n-checkmk-connector@$VERSION already published; skipping"
          else
            npm publish --access public --provenance
          fi
